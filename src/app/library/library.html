<section class="av-hero">
  <h1 class="flicker">ARCADE VAULT</h1>
  <div class="sub">INSERTA UNA MONEDA PARA JUGAR <span class="blink">_</span></div>
</section>

<div class="av-filters">
  <div class="av-search">
    <span class="ico">⌕</span>
    <input
      [value]="query()"
      (input)="query.set($any($event.target).value)"
      placeholder="Buscar un juego por nombre…"
    />
  </div>
  <div class="av-chips">
    @for (c of cats; track c) {
      <button type="button" class="chip" [class.active]="cat() === c" (click)="cat.set(c)">
        {{ c }}
      </button>
    }
  </div>
</div>

<div class="av-grid">
  @for (g of filtered(); track g.id) {
    <app-game-card [game]="g" (selected)="onSelect($event)" />
  } @empty {
    <div style="grid-column: 1 / -1; text-align: center; padding: 80px; color: var(--ink-faint)">
      <div class="pixel" style="font-size: 14px; color: var(--magenta); margin-bottom: 12px">
        NO HAY RESULTADOS
      </div>
      <div>Intenta otra búsqueda o categoría.</div>
    </div>
  }
</div>
