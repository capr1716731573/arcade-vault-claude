<div class="auth-card">
  <div class="auth-header">
    <div class="mark"></div>
    <h2 class="neon-cyan">ARCADE VAULT</h2>
    <div class="mono" style="font-size: 11px; color: var(--ink-faint); letter-spacing: 0.16em; margin-top: 6px">
      ACCESO AL SISTEMA · v2.6
    </div>
  </div>

  <div class="auth-tabs">
    <button type="button" [class.on]="tab() === 'in'" (click)="tab.set('in')">
      INICIAR SESIÓN
    </button>
    <button type="button" [class.on]="tab() === 'up'" (click)="tab.set('up')">CREAR CUENTA</button>
  </div>

  <form (submit)="submit($event)">
    <div class="field">
      <label for="auth-user">Usuario</label>
      <input
        id="auth-user"
        autocomplete="username"
        placeholder="px_kai"
        [value]="user()"
        (input)="user.set($any($event.target).value)"
      />
    </div>
    @if (tab() === 'up') {
      <div class="field slide-in">
        <label for="auth-email">Correo electrónico</label>
        <input id="auth-email" type="email" autocomplete="email" placeholder="jugador@vault.gg" />
      </div>
    }
    <div class="field">
      <label for="auth-pass">Contraseña</label>
      <input
        id="auth-pass"
        type="password"
        autocomplete="current-password"
        placeholder="••••••••"
      />
    </div>

    <button class="btn lg" type="submit" style="width: 100%; margin-top: 8px">
      {{ tab() === 'in' ? 'ENTRAR AL VAULT' : 'CREAR Y JUGAR' }}
    </button>
  </form>

  <button type="button" class="btn ghost" style="width: 100%; margin-top: 10px" (click)="guest()">
    JUGAR COMO INVITADO
  </button>

  <div class="auth-divider">O CONTINÚA CON</div>
  <div class="social">
    <button class="btn ghost" type="button">◆ GOOGLE</button>
    <button class="btn ghost" type="button">▣ GITHUB</button>
  </div>

  <div style="margin-top: 18px; text-align: center; font-size: 11px; color: var(--ink-faint); letter-spacing: 0.1em">
    AL ENTRAR ACEPTAS LOS TÉRMINOS DEL SALÓN ARCADE
  </div>
</div>
